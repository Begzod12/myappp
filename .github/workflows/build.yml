name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Fix permissions
        run: chmod +x node_modules/.bin/expo
      
      - name: Generate iOS project
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios/
      
      - name: Build without signing
        run: |
          cd ios
          xcodebuild build -workspace *.xcworkspace -scheme myapp -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      
      - name: Create IPA
        run: |
          cd ios/build/Release-iphoneos
          mkdir -p Payload
          cp -r myapp.app Payload/
          zip -r myapp.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myapp.ipa
          path: ios/build/Release-iphoneos/myapp.ipa