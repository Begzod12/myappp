name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Expo CLI
        run: npm install -g expo-cli
      
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install
      
      - name: Build and export without signing
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme myapp -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED="NO"
          mkdir -p Payload
          cp -r build/Release-iphoneos/myapp.app Payload/
          zip -r myapp.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myapp-unsigned.ipa
          path: ios/myapp.ipa