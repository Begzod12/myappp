name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm install
      
      - name: Build iOS app
        run: |
          npx expo prebuild --clean
          cd ios
          xcodebuild -workspace myapp.xcworkspace -scheme myapp -sdk iphoneos -configuration Release archive -archivePath ./build/myapp.xcarchive
          xcodebuild -exportArchive -archivePath ./build/myapp.xcarchive -exportPath ./build -exportOptionsPlist exportOptions.plist
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myapp.ipa
          path: ./build/*.ipa